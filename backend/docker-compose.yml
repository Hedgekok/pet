services:
  db:
    image: postgres:16
    container_name: pethealth_db
    environment:
      POSTGRES_USER: pethealth
      POSTGRES_PASSWORD: pethealth
      POSTGRES_DB: pethealth
    ports:
      - "5432:5432"
    volumes:
      - pethealth_pg:/var/lib/postgresql/data

volumes:
  pethealth_pg:
